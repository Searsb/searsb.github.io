# Build settings
remote_theme: jekyll/minima

plugins:
  - jekyll-remote-theme
  - jekyll-toc
# Google Analytics
google_analytics: G-Y0TZ89PQ6J



minima:
  skin: dark
  date_format: "%b %-d, %Y"

  # generate social links in footer
  social_links:
    linkedin: bsears
    github:  searsb
