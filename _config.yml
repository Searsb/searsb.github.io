#baseurl: "/READmd" # the subpath of your site, e.g. /blog
url: "https://bryan-sears.com" # the base hostname & protocol for your site, e.g. http://example.com

author: Bryan Sears
github_username: searsb
email: bry.j.sears@gmail.com
